name: React project checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/react-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/react-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate React production build
        run: npm run build

      - name: Validate course JavaScript
        run: node --check course/course.js

      - name: Validate learning materials JSON
        run: node -e "JSON.parse(require('fs').readFileSync('src/data/material.json', 'utf8'))"
